<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFO Personal · Carlos Amaya</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D0D0D;--s1:#141414;--s2:#1A1A1A;--s3:#222222;--s4:#2A2A2A;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.2);
  --fg:#F0F0F0;--fg2:rgba(240,240,240,0.65);--fg3:rgba(240,240,240,0.35);--fg4:rgba(240,240,240,0.18);
  --prod:#00C896;--pich:#F5C518;--guay:#00D4D4;
  --pos:#00C896;--neg:#FF4D6D;--warn:#F5C518;--info:#8BA7FF;
  --pos-d:rgba(0,200,150,0.08);--neg-d:rgba(255,77,109,0.08);--warn-d:rgba(245,197,24,0.08);--info-d:rgba(139,167,255,0.08);
}
html{background:var(--bg);min-height:100vh}
body{font-family:'DM Sans',sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden}
.bg-grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:200px}
.outer{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:0 24px 80px}
header{display:flex;justify-content:space-between;align-items:center;padding:32px 0 28px;border-bottom:1px solid var(--border2)}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:42px;height:42px;border-radius:10px;background:var(--s3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--fg)}
.brand-info h1{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.brand-info p{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
#ts{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace}
.btn{background:var(--s3);border:1px solid var(--border2);color:var(--fg2);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.2s}
.btn:hover{background:var(--s4);border-color:var(--border3);color:var(--fg)}
.btn-danger{background:rgba(255,77,109,0.1);border-color:rgba(255,77,109,0.3);color:var(--neg)}
.btn-danger:hover{background:rgba(255,77,109,0.2);border-color:rgba(255,77,109,0.5)}
.btn-primary{background:rgba(0,200,150,0.1);border-color:rgba(0,200,150,0.3);color:var(--pos)}
.btn-primary:hover{background:rgba(0,200,150,0.2);border-color:rgba(0,200,150,0.5)}
.layout{display:grid;grid-template-columns:1fr 272px;gap:20px;align-items:start;padding-top:4px}
.main-col{min-width:0}
.side-col{position:sticky;top:24px}
@media(max-width:960px){.layout{grid-template-columns:1fr}.side-col{position:static}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--s2);border:1px solid var(--border2);border-radius:14px;padding:28px;width:100%;max-width:480px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:20px;color:var(--fg)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--fg3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--s3);color:var(--fg)}
.form-row{margin-bottom:14px}
.form-label{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--s3);border:1px solid var(--border2);color:var(--fg);padding:9px 12px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--border3)}
.form-input option{background:var(--s3);color:var(--fg)}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* INLINE EDIT */
.inline-edit-wrap{display:flex;align-items:center;gap:6px}
.inline-input{background:var(--s3);border:1px solid var(--border2);color:var(--fg);padding:4px 8px;border-radius:6px;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;width:110px;outline:none}
.inline-input:focus{border-color:var(--border3)}
.btn-xs{padding:4px 10px;font-size:10px;border-radius:5px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--s3);border:1px solid var(--border2);color:var(--fg);padding:12px 20px;border-radius:10px;font-size:12px;font-family:'DM Mono',monospace;z-index:2000;transform:translateY(100px);opacity:0;transition:all 0.3s;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.toast-ok{border-color:rgba(0,200,150,0.4);color:var(--pos)}
.toast.toast-err{border-color:rgba(255,77,109,0.4);color:var(--neg)}

/* EDIT ACTIONS on TXN rows */
.txn{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.04);gap:8px}
.txn:last-child{border-bottom:none}
.txn:hover{background:rgba(255,255,255,0.02)}
.txn:hover .txn-actions{opacity:1}
.txn-l{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.txn-desc{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace}
.txn-amt{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.txn-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.15s;flex-shrink:0}
.txn-btn{background:var(--s3);border:1px solid var(--border);color:var(--fg3);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:10px;transition:all 0.15s}
.txn-btn:hover{border-color:var(--border2);color:var(--fg)}
.txn-btn.del:hover{background:rgba(255,77,109,0.1);border-color:rgba(255,77,109,0.3);color:var(--neg)}
.txn-btn.edit:hover{background:rgba(139,167,255,0.1);border-color:rgba(139,167,255,0.3);color:var(--info)}

/* ACC balance inline edit */
.acc-bal-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.acc-edit-btn{opacity:0;font-size:10px;color:var(--fg4);transition:opacity 0.15s;background:none;border:none;cursor:pointer;padding:2px 4px}
.acc:hover .acc-edit-btn{opacity:1}

/* SECTION HEADER WITH ADD BUTTON */
.sl-row{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.sl-row .sl-label{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg3)}
.sl-row::after{content:'';flex:1;height:1px;background:var(--border)}
.sl-row .add-btn{background:rgba(0,200,150,0.08);border:1px solid rgba(0,200,150,0.2);color:var(--pos);padding:4px 12px;border-radius:5px;cursor:pointer;font-size:10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:0.1em;flex-shrink:0;transition:all 0.2s}
.sl-row .add-btn:hover{background:rgba(0,200,150,0.15);border-color:rgba(0,200,150,0.4)}

/* Rest of original styles */
.chk-panel{background:var(--s1);border:1px solid var(--border2);border-radius:12px;overflow:hidden;margin-top:28px}
.chk-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.chk-panel-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase}
.chk-panel-badge{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;background:var(--s3);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}
.chk-prog-wrap{height:2px;background:rgba(255,255,255,0.05)}
.chk-prog-fill{height:100%;background:var(--pos);transition:width 0.8s ease}
.chk-list{max-height:calc(100vh - 200px);overflow-y:auto;padding:8px}
.chk-list::-webkit-scrollbar{width:3px}
.chk-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.chk-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;border:1px solid transparent;margin-bottom:3px;transition:all 0.15s}
.chk-item.paid{background:rgba(0,200,150,0.04);border-color:rgba(0,200,150,0.12)}
.chk-item:not(.paid){background:rgba(255,255,255,0.02);border-color:var(--border)}
.chk-dot{width:17px;height:17px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.dot-ok{background:rgba(0,200,150,0.15);color:var(--pos);border:1px solid rgba(0,200,150,0.3)}
.dot-pend{background:transparent;color:var(--fg4);border:1px solid var(--border2)}
.chk-name{flex:1;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk-item.paid .chk-name{color:var(--fg3);text-decoration:line-through;text-decoration-color:rgba(0,200,150,0.3)}
.chk-item.paid .chk-val{color:var(--pos)}
.chk-val{font-size:11px;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--fg3)}
.chk-footer{padding:11px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10px;font-family:'DM Mono',monospace;color:var(--fg3)}
.chk-footer strong{color:var(--fg2)}
.sl{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg3);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}
.g{background:var(--s1);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;transition:border-color 0.2s,background 0.2s}
.g:hover{border-color:var(--border2);background:var(--s2)}
.at{position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0}
.at-prod{background:linear-gradient(90deg,var(--prod),transparent)}
.at-pich{background:linear-gradient(90deg,var(--pich),transparent)}
.at-guay{background:linear-gradient(90deg,var(--guay),transparent)}
.at-neg{background:linear-gradient(90deg,var(--neg),transparent)}
.at-info{background:linear-gradient(90deg,var(--info),transparent)}
.at-warn{background:linear-gradient(90deg,var(--warn),transparent)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.kpi{padding:20px 22px}
.kpi-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--fg3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:12px}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;letter-spacing:-0.01em;line-height:1}
.kpi-sub{font-size:11px;color:var(--fg3);margin-top:7px;font-family:'DM Mono',monospace}
.kpi-badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:3px 9px;border-radius:4px;margin-top:10px;letter-spacing:0.08em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
.bb-pos{background:var(--pos-d);color:var(--pos);border:1px solid rgba(0,200,150,0.25)}
.bb-neg{background:var(--neg-d);color:var(--neg);border:1px solid rgba(255,77,109,0.25)}
.bb-warn{background:var(--warn-d);color:var(--warn);border:1px solid rgba(245,197,24,0.25)}
.pb{height:2px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:14px;overflow:hidden}
.pb-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.c-pos{color:var(--pos)}.c-neg{color:var(--neg)}.c-warn{color:var(--warn)}.c-info{color:var(--info)}
.c-prod{color:var(--prod)}.c-pich{color:var(--pich)}.c-guay{color:var(--guay)}
.black-wrap{padding:24px 26px}
.black-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.black-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.08em}
.black-chip{font-size:9px;padding:4px 12px;border-radius:4px;background:var(--s3);color:var(--fg3);border:1px solid var(--border2);font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase}
.black-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.bi-l{font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;font-family:'DM Mono',monospace}
.bi-v{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1}
.acc{padding:18px 20px}
.acc-bank{font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:2px}
.acc-name{font-size:11px;color:var(--fg3);margin-bottom:12px}
.acc-bal{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1}
.acc-role{font-size:9px;color:var(--fg4);margin-top:6px;text-transform:uppercase;letter-spacing:0.1em;font-family:'DM Mono',monospace}
.acc-prod{border-color:rgba(0,200,150,0.18)}.acc-prod:hover{border-color:rgba(0,200,150,0.35)}
.acc-pich{border-color:rgba(245,197,24,0.18)}.acc-pich:hover{border-color:rgba(245,197,24,0.35)}
.acc-guay{border-color:rgba(0,212,212,0.18)}.acc-guay:hover{border-color:rgba(0,212,212,0.35)}
.cat-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cat-row:last-child{border-bottom:none}
.cat-name{font-size:12px;color:var(--fg2);width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar{flex:1;height:2px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.cat-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0.45),rgba(255,255,255,0.15))}
.cat-amt{font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--fg2);width:60px;text-align:right;flex-shrink:0}
.src{font-size:8px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--fg4);border:1px solid var(--border);margin-left:5px;font-family:'DM Mono',monospace}
.badge-maxi{font-size:8px;padding:2px 6px;border-radius:3px;background:rgba(0,200,150,0.08);color:var(--prod);border:1px solid rgba(0,200,150,0.2);margin-left:5px;font-family:'DM Mono',monospace}
.badge-bank{font-size:8px;padding:2px 6px;border-radius:3px;margin-left:4px;font-family:'DM Mono',monospace;font-weight:500}
.bank-prod{background:rgba(0,200,150,0.08);color:var(--prod);border:1px solid rgba(0,200,150,0.2)}
.bank-pich{background:rgba(245,197,24,0.08);color:var(--pich);border:1px solid rgba(245,197,24,0.2)}
.bank-guay{background:rgba(0,212,212,0.08);color:var(--guay);border:1px solid rgba(0,212,212,0.2)}
.bank-unk{background:rgba(255,255,255,0.04);color:var(--fg4);border:1px solid var(--border)}
.sobre-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.sobre-row:last-child{border-bottom:none}
.sobre-name{font-size:12px;color:var(--fg2);width:140px;flex-shrink:0}
.sobre-bar{flex:1;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.sobre-fill{height:100%;border-radius:2px}
.sobre-amt{font-size:10px;color:var(--fg3);width:90px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}
.loading{color:var(--fg3);font-size:11px;padding:80px 0;text-align:center;font-family:'DM Mono',monospace;letter-spacing:0.08em}
.op-cuentas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.op-card{background:var(--s1);border-radius:12px;padding:16px 20px;position:relative;overflow:hidden;transition:border-color 0.2s}
.op-card-pich{border:1px solid rgba(245,197,24,0.3)}
.op-card-prod{border:1px solid rgba(0,200,150,0.3)}
.op-bank{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:2px}
.op-name{font-size:10px;color:var(--fg3);margin-bottom:10px}
.op-bal{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1;cursor:pointer;transition:opacity 0.2s}
.op-bal:hover{opacity:0.7}
.op-tag{font-size:8px;color:var(--fg4);margin-top:5px;text-transform:uppercase;letter-spacing:0.12em;font-family:'DM Mono',monospace}
.pie-wrap{display:flex;gap:24px;align-items:center;padding:20px 22px}
.pie-svg{flex-shrink:0}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:8px}
.pie-leg-item{display:flex;align-items:center;gap:8px}
.pie-leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pie-leg-name{font-size:11px;color:var(--fg2);flex:1}
.pie-leg-amt{font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--fg2)}
.pie-leg-pct{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;width:32px;text-align:right}
.gasto-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.gb-item{background:var(--s1);padding:16px 20px}
.gb-label{font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em;font-family:'DM Mono',monospace;margin-bottom:6px}
.gb-val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.gb-sub{font-size:10px;color:var(--fg3);margin-top:3px;font-family:'DM Mono',monospace}

/* Show all transactions toggle */
.show-more{text-align:center;padding:12px;border-top:1px solid var(--border)}
.show-more button{background:none;border:none;color:var(--fg3);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.08em}
.show-more button:hover{color:var(--fg2)}
</style>
</head>
<body>
<div class="bg-grain"></div>

<!-- MODAL EDITAR/AGREGAR TRANSACCIÓN -->
<div class="modal-overlay" id="modal-txn">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-txn')">✕</button>
    <p class="modal-title" id="modal-txn-title">Editar Transacción</p>
    <input type="hidden" id="txn-edit-id">
    <div class="form-grid2">
      <div class="form-row">
        <label class="form-label">Tipo</label>
        <select class="form-input" id="txn-type">
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
          <option value="ingreso_variable">Ingreso Variable</option>
          <option value="transferencia">Transferencia</option>
          <option value="pago_tarjeta">Pago Tarjeta</option>
          <option value="inversion">Inversión</option>
          <option value="ahorro_diferido">Ahorro Diferido</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Monto ($)</label>
        <input class="form-input" type="number" step="0.01" id="txn-amount" placeholder="0.00">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Descripción</label>

// ─── PIE CHART ────────────────────────────────────────────────────────────
function buildPie(cats,total,size=160){
  if(!cats.length) return '<svg width="'+size+'" height="'+size+'"></svg>';
  let angle=-Math.PI/2;
  const cx=size/2,cy=size/2,r=size/2-8,ri=r*0.55;
  let paths='';
  cats.forEach((c,i)=>{
    const slice=c[1]/total*Math.PI*2;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    const x2=cx+r*Math.cos(angle+slice),y2=cy+r*Math.sin(angle+slice);
    const xi1=cx+ri*Math.cos(angle),yi1=cy+ri*Math.sin(angle);
    const xi2=cx+ri*Math.cos(angle+slice),yi2=cy+ri*Math.sin(angle+slice);
    const large=slice>Math.PI?1:0;
    const col=PIE_COLORS[i%PIE_COLORS.length];
    paths+=`<path d="M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${large},0 ${xi1},${yi1}" fill="${col}" opacity="0.9"/>`;
    angle+=slice;
  });
  return `<svg class="pie-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${ri-2}" fill="var(--s1)"/></svg>`;
}

function bankBadge(banco){
  if(!banco) return '';
  const b=banco.toLowerCase();
  if(b.includes('produbanco')) return `<span class="badge-bank bank-prod">Produbanco</span>`;
  if(b.includes('pichincha')) return `<span class="badge-bank bank-pich">Pichincha</span>`;
  if(b.includes('guayaquil')) return `<span class="badge-bank bank-guay">Guayaquil</span>`;
  return `<span class="badge-bank bank-unk">${banco}</span>`;
}

    // Desglose gastos
    html+=`<div class="g" style="margin-bottom:10px;overflow:hidden"><div class="gasto-breakdown">`;
    html+=`<div class="gb-item"><p class="gb-label">Gastos directos</p><p class="gb-val c-neg">${fmtFull(tGDirect)}</p><p class="gb-sub">compras, servicios, comida</p></div>`;
    html+=`<div class="gb-item"><p class="gb-label">Pago tarjeta Black</p><p class="gb-val c-warn">${fmtFull(tGTarjeta)}</p><p class="gb-sub">liquidación ciclo anterior</p></div>`;
    html+=`</div></div>`;

    // Cuentas operativas editables
    html+=`<div class="op-cuentas">`;
    html+=editableOpBal(opPich,'c-pich','Operativa');
    html+=editableOpBal(recep,'c-prod','Black');
    html+=`</div>`;

    // Tarjeta Black
    html+=`<p class="sl">tarjeta black · Produbanco</p>`;
    html+=`<div class="g" style="margin-bottom:20px;border-color:rgba(0,200,150,0.15)"><div class="at at-prod"></div><div class="black-wrap">
      <div class="black-top"><span class="black-name">BLACK MASTERCARD 💳</span><span class="black-chip">${Math.max(0,bDias)}d para corte · ${bCut}</span></div>
      <div class="black-grid">
        <div><p class="bi-l">Deuda anterior</p><p class="bi-v c-warn">${fmtFull(bDeuda)}</p></div>
        <div><p class="bi-l">Ciclo actual</p><p class="bi-v c-info">${fmtFull(bCiclo)}</p></div>
        <div><p class="bi-l">Total a pagar</p><p class="bi-v ${bTotal>500?'c-neg':bTotal>300?'c-warn':'c-pos'}">${fmtFull(bTotal)}</p></div>
        <div><p class="bi-l">Fecha pago</p><p class="bi-v" style="font-size:18px;color:var(--fg)">${bPago}</p></div>
      </div>
      <div class="pb" style="margin-top:18px"><div class="pb-fill" style="width:${Math.min(100,pct(bDeuda,presupuesto))}%;background:${bDeuda>400?'var(--neg)':bDeuda>250?'var(--warn)':'var(--prod)'}"></div></div>
      <p style="font-size:9px;color:var(--fg4);margin-top:6px;font-family:'DM Mono',monospace">deuda vs ingreso mensual ${fmtFull(presupuesto)}</p>
    </div></div>`;

    // KPIs financieros
    html+=`<p class="sl">kpis financieros</p>`;
    html+=`<div class="g4" style="margin-bottom:20px">`;
    html+=`<div class="g kpi"><p class="kpi-label">Fondo emergencia</p><p class="kpi-val ${fePct>=50?'c-pos':fePct>=25?'c-warn':'c-neg'}">${fePct.toFixed(1)}%</p><p class="kpi-sub">${fmtFull(feSaldo)} de ${fmtFull(feMeta)}</p><div class="pb"><div class="pb-fill" style="width:${fePct}%;background:${fePct>=50?'var(--pos)':fePct>=25?'var(--warn)':'var(--neg)'}"></div></div></div>`;
    html+=`<div class="g kpi"><p class="kpi-label">Gastos fijos</p><p class="kpi-val ${chkPct>=80?'c-pos':chkPct>=50?'c-warn':'c-neg'}">${pagados.length}<span style="font-size:18px;font-weight:400;color:var(--fg3)"> / ${CHK.length}</span></p><p class="kpi-sub">${fmtFull(tPagado)} de ${fmtFull(tFijos)}</p><div class="pb"><div class="pb-fill" style="width:${chkPct}%;background:${chkPct>=80?'var(--pos)':chkPct>=50?'var(--warn)':'var(--neg)'}"></div></div></div>`;
    html+=`<div class="g kpi"><p class="kpi-label">Transacciones</p><p class="kpi-val c-info">${T.length}</p><p class="kpi-sub">Auto: ${T.filter(t=>t.source==='gmail').length} · Manual: ${T.filter(t=>t.source==='telegram').length}</p></div>`;
    html+=`<div class="g kpi"><div class="at at-info"></div><p class="kpi-label">Patrimonio total</p><p class="kpi-val c-info">${fmtFull(patrimonio)}</p><p class="kpi-sub">todas las cuentas</p></div>`;
    html+=`</div>`;

    // Cuentas Produbanco con balances editables
    html+=`<p class="sl">cuentas · Produbanco</p>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px">`;
    [{a:recep,label:'BLACK 💳'},{a:opProd,label:'Fondo emergencia'},{a:flexi,label:'Diferidos acumulados'}].forEach(({a,label})=>{
      html+=`<div class="g acc acc-prod"><div class="at at-prod"></div><p class="acc-bank c-prod">Produbanco</p><p class="acc-name">${a.name||'-'}</p>${editableAccBal(a,'c-prod')}<p class="acc-role">${label}</p></div>`;
    });
    html+=`</div>`;

    html+=`<p class="sl">cuentas · Pichincha</p>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px">`;
    [{a:opPich,label:'Operativa DeUna'},{a:ahorPich,label:'Ahorro con propósito'}].forEach(({a,label})=>{
      html+=`<div class="g acc acc-pich"><div class="at at-pich"></div><p class="acc-bank c-pich">Pichincha</p><p class="acc-name">${a.name||'-'}</p>${editableAccBal(a,'c-pich')}<p class="acc-role">${label}</p></div>`;
    });
    html+=`</div>`;

    html+=`<p class="sl">cuentas · Guayaquil</p>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px">`;
    [{a:inv,label:'Inversión mensual'},{a:metas,label:'Metas'}].forEach(({a,label})=>{
      html+=`<div class="g acc acc-guay"><div class="at at-guay"></div><p class="acc-bank c-guay">Guayaquil</p><p class="acc-name">${a.name||'-'}</p>${editableAccBal(a,'c-guay')}<p class="acc-role">${label}</p></div>`;
    });
    html+=`</div>`;

    // Categorías y transacciones
    html+=`<div class="g2" style="margin-bottom:20px;align-items:start">`;

    // Categorías con pie
    html+=`<div>`;
    if(topCats.length>0){
      html+=`<p class="sl">gastos por categoría</p>`;
      html+=`<div class="g"><div class="pie-wrap">`;
      html+=buildPie(topCats,tGDirect);
      html+=`<div class="pie-legend">`;
      topCats.forEach((c,i)=>{
        const p2=tGDirect>0?(c[1]/tGDirect*100):0;
        html+=`<div class="pie-leg-item"><div class="pie-leg-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></div><span class="pie-leg-name">${c[0]}</span><span class="pie-leg-amt">${fmt(c[1])}</span><span class="pie-leg-pct">${p2.toFixed(0)}%</span></div>`;
      });
      html+=`</div></div>`;
      html+=`<div style="padding:0 20px 16px">`;
      topCats.forEach(([cat,amt])=>{
        html+=`<div class="cat-row"><span class="cat-name">${cat}</span><div class="cat-bar"><div class="cat-fill" style="width:${pct(amt,maxC)}%"></div></div><span class="cat-amt">${fmt(amt)}</span></div>`;
      });
      html+=`</div></div>`;
    }
    html+=`</div>`;

    // Transacciones editables
    html+=`<div>`;
    const visibleTxns=_showAll?T:T.slice(0,15);
    html+=`<div class="sl-row"><span class="sl-label">transacciones del mes</span><button class="add-btn" onclick="openAddTxn()">+ Nueva</button></div>`;
    html+=`<div class="g" style="padding:4px 0" id="txn-list">`;
    visibleTxns.forEach(t=>{ html+=renderTxnRow(t); });
    html+=`</div>`;
    if(T.length>15){
      html+=`<div class="show-more"><button onclick="_showAll=!_showAll;load()">${_showAll?'▲ Ver menos':'▼ Ver todas ('+T.length+')' }</button></div>`;
    }
    html+=`</div></div>`;

    if(E.length>0){
      html+=`<p class="sl">sobres activos</p><div class="g" style="padding:16px 20px;margin-bottom:20px">`;
      E.forEach(e=>{
        const p2=pct($f(e.spent),$f(e.budgeted));
        html+=`<div class="sobre-row"><span class="sobre-name">${e.name}</span><div class="sobre-bar"><div class="sobre-fill" style="width:${p2}%;background:${p2>80?'var(--neg)':p2>50?'var(--warn)':'var(--pos)'}"></div></div><span class="sobre-amt">${fmt(e.spent)} / ${fmt(e.budgeted)}</span></div>`;
      });
      html+=`</div>`;
    }

    document.getElementById('main').innerHTML=html;
    document.getElementById('ts').textContent=`// ${now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})} · ${mesLabel}`;
  }catch(err){
    document.getElementById('main').innerHTML=`<p style="color:var(--neg);font-family:'DM Mono',monospace;padding:24px">// error: ${err.message}</p>`;
    document.getElementById('ts').textContent='// error';
    console.error(err);
  }
}
load();
setInterval(load,300000);
</script>
</body>
</html>
