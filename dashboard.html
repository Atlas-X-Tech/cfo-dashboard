<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFO Personal · Carlos Amaya</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0D0B;--s1:rgba(255,255,255,0.025);--s2:rgba(255,255,255,0.035);--s3:rgba(255,255,255,0.05);--s4:rgba(255,255,255,0.07);
  --border:rgba(218,215,205,0.08);--border2:rgba(218,215,205,0.14);--border3:rgba(218,215,205,0.22);
  --fg:#DAD7CD;--fg2:rgba(218,215,205,0.68);--fg3:rgba(218,215,205,0.4);--fg4:rgba(218,215,205,0.22);
  --olive:#A3B18A;--olive-d:#588157;--olive-dd:#344E41;--cream:#DAD7CD;--brass:#C8A560;
  --prod:#A3B18A;--pich:#C8A560;--guay:#7A9586;
  --pos:#A3B18A;--neg:#B5651D;--warn:#C8A560;--info:#7A9586;
  --pos-d:rgba(163,177,138,0.10);--neg-d:rgba(181,101,29,0.10);--warn-d:rgba(200,165,96,0.10);--info-d:rgba(122,149,134,0.10);
  --glass-strong:rgba(255,255,255,0.04);--glass-light:rgba(255,255,255,0.025);
}
html{background:var(--bg);min-height:100vh}
html::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top left,rgba(88,129,87,0.08),transparent 50%),radial-gradient(ellipse at bottom right,rgba(52,78,65,0.12),transparent 50%);pointer-events:none;z-index:0}
body{font-family:'DM Sans',sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden;letter-spacing:0.005em}
.bg-grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.015;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:200px}
.outer{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:0 24px 80px}
header{padding:32px 0 24px;border-bottom:0.5px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:44px;height:44px;border-radius:12px;background:var(--glass-strong);border:0.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--olive)}
.brand-info h1{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--cream)}
.brand-info p{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header-summary{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;background:var(--s2);border:0.5px solid var(--border);border-radius:8px;padding:6px 14px;display:flex;gap:16px;flex-wrap:wrap}
.hs-item{display:flex;align-items:center;gap:5px}
.hs-label{color:var(--fg4)}
.hs-val{color:var(--fg2);font-weight:500}
.hs-val.pos{color:var(--olive)}
.hs-val.neg{color:var(--neg)}
.hs-val.warn{color:var(--warn)}
.btn{background:var(--glass-light);border:0.5px solid var(--border2);color:var(--fg2);padding:8px 18px;border-radius:9px;cursor:pointer;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;transition:all 0.2s ease;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s4);border-color:var(--olive-d);color:var(--cream)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-danger{background:rgba(181,101,29,0.10);border-color:rgba(181,101,29,0.30);color:var(--neg)}
.btn-danger:hover{background:rgba(181,101,29,0.18);border-color:rgba(181,101,29,0.50)}
.btn-primary{background:rgba(163,177,138,0.10);border-color:rgba(163,177,138,0.30);color:var(--olive)}
.btn-primary:hover{background:rgba(163,177,138,0.18);border-color:rgba(163,177,138,0.55)}
.btn-sueldo{background:rgba(163,177,138,0.12);border:0.5px solid rgba(163,177,138,0.40);color:var(--olive);font-size:11px;padding:8px 18px;font-weight:700;letter-spacing:0.12em}
.btn-sueldo:hover{background:rgba(163,177,138,0.22);border-color:rgba(163,177,138,0.65);color:var(--cream)}
.layout{display:grid;grid-template-columns:1fr 272px;gap:20px;align-items:start;padding-top:4px}
.main-col{min-width:0}
.side-col{position:sticky;top:24px}
@media(max-width:960px){.layout{grid-template-columns:1fr}.side-col{position:static}}
.modal-overlay{position:fixed;inset:0;background:rgba(10,13,11,0.72);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(14px)}
.modal-overlay.open{display:flex}
.modal{background:rgba(18,22,19,0.95);border:0.5px solid var(--border2);border-radius:18px;padding:30px;width:100%;max-width:480px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:20px;color:var(--fg)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--fg3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--s3);color:var(--fg)}
.form-row{margin-bottom:14px}
.form-label{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--glass-light);border:0.5px solid var(--border2);color:var(--cream);padding:10px 14px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:all 0.2s;-webkit-appearance:none}
.form-input:focus{border-color:rgba(163,177,138,0.45);background:var(--s3)}
.form-input.error{border-color:rgba(181,101,29,0.60)}
.form-input option{background:#1A1F1B;color:var(--cream)}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.transfer-field{display:none}
.transfer-field.visible{display:block}
.deferred-fields{display:none}
.deferred-fields.visible{display:block}
.inline-edit-wrap{display:flex;align-items:center;gap:6px}
.inline-input{background:var(--s3);border:1px solid var(--border2);color:var(--fg);padding:4px 8px;border-radius:6px;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;width:110px;outline:none}
.btn-xs{padding:4px 10px;font-size:10px;border-radius:5px}
.toast{position:fixed;bottom:24px;right:24px;background:rgba(18,22,19,0.95);border:0.5px solid var(--border2);color:var(--cream);padding:14px 22px;border-radius:12px;font-size:12px;font-family:'DM Mono',monospace;z-index:2000;transform:translateY(100px);opacity:0;transition:all 0.3s;max-width:340px;letter-spacing:0.04em}
.toast.show{transform:translateY(0);opacity:1}
.toast.toast-ok{border-color:rgba(163,177,138,0.45);color:var(--olive)}
.toast.toast-err{border-color:rgba(181,101,29,0.45);color:var(--neg)}
.toast.toast-warn{border-color:rgba(200,165,96,0.45);color:var(--warn)}
.txn{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.04);gap:8px}
.txn:last-child{border-bottom:none}
.txn:hover{background:rgba(255,255,255,0.02)}
.txn:hover .txn-actions{opacity:1}
.txn-l{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.txn-desc{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace}
.txn-amt{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.txn-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.15s;flex-shrink:0}
.txn-btn{background:var(--s3);border:1px solid var(--border);color:var(--fg3);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:10px;transition:all 0.15s}
.txn-btn:hover{border-color:var(--border2);color:var(--fg)}
.txn-btn.del:hover{background:rgba(181,101,29,0.10);border-color:rgba(181,101,29,0.30);color:var(--neg)}
.txn-btn.edit:hover{background:rgba(122,149,134,0.10);border-color:rgba(122,149,134,0.30);color:var(--info)}
.chk-panel{background:var(--glass-light);border:0.5px solid var(--border2);border-radius:16px;overflow:hidden;margin-top:28px}
.chk-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.chk-panel-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase}
.chk-panel-badge{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;background:var(--s3);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}
.chk-prog-wrap{height:2px;background:rgba(255,255,255,0.05)}
.chk-prog-fill{height:100%;background:var(--olive);transition:width 0.8s ease}
.chk-list{max-height:calc(100vh - 200px);overflow-y:auto;padding:8px}
.chk-list::-webkit-scrollbar{width:3px}
.chk-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.chk-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;border:1px solid transparent;margin-bottom:3px;transition:all 0.15s;cursor:pointer}
.chk-item.paid{background:rgba(163,177,138,0.05);border-color:rgba(163,177,138,0.14)}
.chk-item:not(.paid){background:rgba(255,255,255,0.02);border-color:var(--border)}
.chk-item:hover{border-color:var(--border2)}
.chk-dot{width:17px;height:17px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.dot-ok{background:rgba(163,177,138,0.18);color:var(--olive);border:0.5px solid rgba(163,177,138,0.35)}
.dot-pend{background:transparent;color:var(--fg4);border:1px solid var(--border2)}
.chk-name{flex:1;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk-item.paid .chk-name{color:var(--fg3);text-decoration:line-through;text-decoration-color:rgba(163,177,138,0.35)}
.chk-item.paid .chk-val{color:var(--olive)}
.chk-val{font-size:11px;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--fg3)}
.chk-footer{padding:11px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10px;font-family:'DM Mono',monospace;color:var(--fg3)}
.chk-footer strong{color:var(--fg2)}
.sl{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--fg3);margin:32px 0 14px;display:flex;align-items:center;gap:12px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}
.sl-row{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.sl-row .sl-label{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--fg3)}
.sl-row::after{content:'';flex:1;height:1px;background:var(--border)}
.sl-row .add-btn{background:rgba(163,177,138,0.10);border:0.5px solid rgba(163,177,138,0.25);color:var(--olive);padding:5px 14px;border-radius:8px;cursor:pointer;font-size:10px;font-family:'Barlow Condensed',sans-serif;font-weight:500;letter-spacing:0.14em;flex-shrink:0;transition:all 0.2s;text-transform:uppercase}
.sl-row .add-btn:hover{background:rgba(163,177,138,0.18);border-color:rgba(163,177,138,0.45)}
.g{background:var(--glass-light);border:0.5px solid var(--border);border-radius:16px;position:relative;overflow:hidden;transition:all 0.3s cubic-bezier(.4,0,.2,1)}
.g:hover{border-color:var(--border2);background:var(--glass-strong);transform:translateY(-1px)}
.at{position:absolute;top:0;left:0;right:0;height:1px;border-radius:16px 16px 0 0;opacity:0.7}
.at-prod{background:linear-gradient(90deg,var(--olive),transparent)}
.at-pich{background:linear-gradient(90deg,var(--brass),transparent)}
.at-guay{background:linear-gradient(90deg,var(--info),transparent)}
.at-neg{background:linear-gradient(90deg,var(--neg),transparent)}
.at-info{background:linear-gradient(90deg,var(--info),transparent)}
.at-warn{background:linear-gradient(90deg,var(--brass),transparent)}
.at-cash{background:linear-gradient(90deg,#7B9E6B,transparent)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.kpi{padding:24px 26px}
.kpi-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--fg3);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:14px;font-weight:500}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:500;letter-spacing:-0.01em;line-height:1;color:var(--cream)}
.kpi-sub{font-size:10px;color:var(--fg3);margin-top:9px;font-family:'DM Mono',monospace;letter-spacing:0.05em}
.kpi-badge{display:inline-flex;align-items:center;font-size:9px;font-weight:500;padding:4px 10px;border-radius:6px;margin-top:12px;letter-spacing:0.14em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
.bb-pos{background:var(--pos-d);color:var(--olive);border:0.5px solid rgba(163,177,138,0.30)}
.bb-neg{background:var(--neg-d);color:var(--neg);border:0.5px solid rgba(181,101,29,0.30)}
.bb-warn{background:var(--warn-d);color:var(--warn);border:0.5px solid rgba(200,165,96,0.30)}
.pb{height:2px;background:rgba(218,215,205,0.06);border-radius:2px;margin-top:16px;overflow:hidden}
.pb-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.c-pos{color:var(--olive)}.c-neg{color:var(--neg)}.c-warn{color:var(--brass)}.c-info{color:var(--info)}
.c-prod{color:var(--olive)}.c-pich{color:var(--brass)}.c-guay{color:var(--info)}.c-cash{color:#7B9E6B}
.black-wrap{padding:24px 26px}
.black-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.black-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.10em;color:var(--cream)}
.black-chip{font-size:9px;padding:5px 14px;border-radius:8px;background:var(--glass-light);color:var(--fg3);border:0.5px solid var(--border2);font-family:'DM Mono',monospace;letter-spacing:0.14em;text-transform:uppercase}
.black-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.bi-l{font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;font-family:'DM Mono',monospace}
.bi-v{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:500;line-height:1;letter-spacing:-0.005em}
/* Card expandable */
.card-toggle{width:100%;background:none;border:none;display:flex;align-items:center;justify-content:space-between;padding:8px 0 0;cursor:pointer;color:var(--fg3);font-size:10px;font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s}
.card-toggle:hover{color:var(--fg2)}
.card-toggle-icon{transition:transform 0.3s}
.card-toggle-icon.open{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.card-body.open{max-height:600px}
.acc{padding:18px 20px}
.acc-bank{font-size:11px;font-weight:500;letter-spacing:0.20em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:3px}
.acc-name{font-size:11px;color:var(--fg3);margin-bottom:12px}
.acc-bal{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:500;line-height:1;cursor:pointer;transition:opacity 0.2s}
.acc-bal:hover{opacity:0.7}
.acc-role{font-size:9px;color:var(--fg4);margin-top:6px;text-transform:uppercase;letter-spacing:0.1em;font-family:'DM Mono',monospace}
.acc-prod{border-color:rgba(163,177,138,0.18)}.acc-prod:hover{border-color:rgba(163,177,138,0.35)}
.acc-pich{border-color:rgba(200,165,96,0.18)}.acc-pich:hover{border-color:rgba(200,165,96,0.35)}
.acc-guay{border-color:rgba(122,149,134,0.18)}.acc-guay:hover{border-color:rgba(122,149,134,0.35)}
.acc-cash{border-color:rgba(123,158,107,0.18)}.acc-cash:hover{border-color:rgba(123,158,107,0.35)}
.op-cuentas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.op-card{background:var(--glass-light);border-radius:16px;padding:18px 22px;position:relative;overflow:hidden;transition:all 0.3s cubic-bezier(.4,0,.2,1)}
.op-card-pich{border:0.5px solid rgba(200,165,96,0.25)}
.op-card-prod{border:0.5px solid rgba(163,177,138,0.25)}
.op-card-cash{border:0.5px solid rgba(123,158,107,0.25)}
.op-bank{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:2px}
.op-name{font-size:10px;color:var(--fg3);margin-bottom:10px}
.op-bal{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:500;line-height:1;cursor:pointer;transition:opacity 0.2s;letter-spacing:-0.005em}
.op-bal:hover{opacity:0.7}
.op-tag{font-size:8px;color:var(--fg4);margin-top:5px;text-transform:uppercase;letter-spacing:0.12em;font-family:'DM Mono',monospace}
.cat-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cat-row:last-child{border-bottom:none}
.cat-name{font-size:12px;color:var(--fg2);width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar{flex:1;height:2px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.cat-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0.45),rgba(255,255,255,0.15))}
.cat-amt{font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--fg2);width:60px;text-align:right;flex-shrink:0}
.src{font-size:8px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--fg4);border:1px solid var(--border);margin-left:5px;font-family:'DM Mono',monospace}
.badge-maxi{font-size:8px;padding:3px 7px;border-radius:5px;background:rgba(163,177,138,0.10);color:var(--olive);border:0.5px solid rgba(163,177,138,0.22);margin-left:5px;font-family:'DM Mono',monospace}
.badge-bank{font-size:8px;padding:2px 6px;border-radius:3px;margin-left:4px;font-family:'DM Mono',monospace;font-weight:500}
.bank-prod{background:rgba(163,177,138,0.10);color:var(--olive);border:0.5px solid rgba(163,177,138,0.22)}
.bank-pich{background:rgba(200,165,96,0.10);color:var(--brass);border:0.5px solid rgba(200,165,96,0.22)}
.bank-guay{background:rgba(122,149,134,0.10);color:var(--info);border:0.5px solid rgba(122,149,134,0.22)}
.bank-unk{background:rgba(255,255,255,0.04);color:var(--fg4);border:1px solid var(--border)}
.badge-def{font-size:8px;padding:2px 7px;border-radius:4px;background:rgba(200,165,96,0.12);color:var(--warn);border:0.5px solid rgba(200,165,96,0.28);margin-left:4px;font-family:'DM Mono',monospace}
.sobre-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.sobre-row:last-child{border-bottom:none}
.sobre-name{font-size:12px;color:var(--fg2);width:140px;flex-shrink:0}
.sobre-bar{flex:1;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.sobre-fill{height:100%;border-radius:2px}
.sobre-amt{font-size:10px;color:var(--fg3);width:90px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}
.gf-cat-section{margin-bottom:12px}
.gf-cat-header{display:flex;align-items:center;gap:8px;padding:9px 14px;background:rgba(255,255,255,0.02);border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none}
.gf-cat-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;flex:1}
.gf-cat-count{font-size:9px;color:var(--fg4);font-family:'DM Mono',monospace;background:var(--s3);padding:2px 6px;border-radius:3px}
.gf-cat-total{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700}
.gf-items{border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden}
.gf-item{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.04);transition:background .15s}
.gf-item:last-child{border-bottom:none}
.gf-item:hover{background:rgba(255,255,255,0.02)}
.gf-item:hover .gf-acts{opacity:1}
.gf-item.inactive{opacity:.35}
.gf-iname{flex:1;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf-ifreq{font-size:9px;color:var(--fg4);font-family:'DM Mono',monospace;flex-shrink:0;width:60px;text-align:center}
.gf-iamt{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;flex-shrink:0;width:62px;text-align:right}
.gf-acts{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0}
.gf-tog{width:26px;height:14px;border-radius:7px;border:none;cursor:pointer;flex-shrink:0;position:relative;transition:background .2s}
.gf-tog.on{background:rgba(163,177,138,.35)}.gf-tog.off{background:rgba(255,255,255,.1)}
.gf-tog::after{content:'';position:absolute;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .2s}
.gf-tog.on::after{left:14px}.gf-tog.off::after{left:2px}
.gf-deferred-badge{font-size:8px;padding:2px 6px;border-radius:4px;background:rgba(200,165,96,0.12);color:var(--warn);border:0.5px solid rgba(200,165,96,0.28);font-family:'DM Mono',monospace;flex-shrink:0}
.gf-summary{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:7px;margin-top:10px;font-family:'DM Mono',monospace;font-size:10px;color:var(--fg3)}
.gf-summary strong{color:var(--fg2)}
.gasto-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.gb-item{background:var(--s1);padding:16px 20px}
.gb-label{font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em;font-family:'DM Mono',monospace;margin-bottom:6px}
.gb-val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.gb-sub{font-size:10px;color:var(--fg3);margin-top:3px;font-family:'DM Mono',monospace}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter-select{background:#1A1F1B;border:0.5px solid var(--border2);color:var(--fg2);padding:6px 10px;border-radius:8px;font-size:11px;font-family:'DM Mono',monospace;outline:none;cursor:pointer;-webkit-appearance:none}
.filter-select:focus{border-color:var(--border3)}
.filter-select option{background:#1A1F1B;color:var(--cream)}
.pie-wrap{display:flex;gap:24px;align-items:center;padding:20px 22px}
.pie-svg{flex-shrink:0}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:8px}
.pie-leg-item{display:flex;align-items:center;gap:8px}
.pie-leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pie-leg-name{font-size:11px;color:var(--fg2);flex:1}
.pie-leg-amt{font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--fg2)}
.pie-leg-pct{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace;width:32px;text-align:right}
.show-more{text-align:center;padding:12px;border-top:1px solid var(--border)}
.show-more button{background:none;border:none;color:var(--fg3);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.08em}
.show-more button:hover{color:var(--fg2)}
.loading{color:var(--fg3);font-size:11px;padding:80px 0;text-align:center;font-family:'DM Mono',monospace;letter-spacing:0.08em}
/* Efectivo card */
.cash-card{background:var(--glass-light);border:0.5px solid rgba(123,158,107,0.25);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;transition:all 0.3s}
.cash-card:hover{border-color:rgba(123,158,107,0.45);transform:translateY(-1px)}
.cash-flows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cash-flow-item{background:var(--s2);border-radius:8px;padding:10px 14px;border:0.5px solid var(--border)}
.cash-flow-label{font-size:9px;color:var(--fg4);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.cash-flow-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
/* Diferidos en card */
.deferred-list{padding:12px 0 0}
.deferred-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.deferred-item:last-child{border-bottom:none}
.deferred-progress{flex:1}
.deferred-name{font-size:11px;color:var(--fg2);margin-bottom:4px}
.deferred-bar{height:2px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.deferred-bar-fill{height:100%;background:var(--warn);border-radius:2px}
.deferred-meta{font-size:9px;color:var(--fg3);font-family:'DM Mono',monospace;margin-top:3px}
.deferred-amt{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--warn);flex-shrink:0}
.divider-section{height:0.5px;background:var(--border);margin:8px 0 16px}
</style>
</head>

<script>
const SB='https://apdgxypnkrphulpcplpv.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwZGd4eXBua3JwaHVscGNwbHB2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3Nzc0MjA5NiwiZXhwIjoyMDkzMzE4MDk2fQ.KVECO5w6Y0-lqFw9Uo_VCJLy_lqRfMyZ-uLus_vFxto';
const H={apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'};
const SUELDO=1049;
const PROD_CORRIENTE_ID='2ce5fd6d-eade-4502-8023-9f205a58d203';
const PIE_COLORS=['#A3B18A','#588157','#C8A560','#7A9586','#9B9072','#B5651D','#6B8E5A','#8FA381','#A89A6F','#5E7E5A','#C4B58A','#7B9E6B'];

const $f=n=>parseFloat(n||0);
const fmt=n=>'$'+$f(n).toFixed(2);
const fmtFull=n=>'$'+$f(n).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b>0?Math.min(100,a/b*100):0;
const q=p=>fetch(SB+'/rest/v1/'+p,{headers:H}).then(r=>r.json());

let _cats=[], _accs=[], _allTxns=[], _histTxns=[], _showAll=false, _filterAcc='', _balOrig={};

function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast toast-'+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){['modal-txn','modal-confirm','modal-gf'].forEach(closeModal);}
});

// ── DIFERIDOS FIELDS ────────────────────────────────────────────────────────
function toggleDeferredFields(){
  const cb=document.getElementById('gf-is-deferred');
  const fields=document.getElementById('deferred-fields');
  fields.className='deferred-fields'+(cb.checked?' visible':'');
  if(cb.checked){
    const now=new Date();
    document.getElementById('gf-deferred-start').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    document.getElementById('gf-deferred-current').value='1';
  }
}

function calcDeferredInstallment(){
  const total=$f(document.getElementById('gf-deferred-total').value);
  const n=parseInt(document.getElementById('gf-deferred-installments').value)||0;
  const interest=$f(document.getElementById('gf-deferred-interest').value);
  const prev=document.getElementById('deferred-preview');
  if(!total||!n){prev.style.display='none';return;}
  const totalConInteres=total*(1+interest/100);
  const cuota=totalConInteres/n;
  document.getElementById('gf-amount').value=cuota.toFixed(2);
  prev.style.display='block';
  prev.innerHTML=`Cuota: <strong>$${cuota.toFixed(2)}</strong> · Total con interés: <strong>$${totalConInteres.toFixed(2)}</strong> · ${n} meses`;
}

// ── BALANCE INLINE EDIT ─────────────────────────────────────────────────────
function editBalance(accId,currentBal,colorClass,elId){
  const el=document.getElementById(elId);
  if(!el) return;
  _balOrig[elId]=el.innerHTML;
  el.innerHTML=`<div class="inline-edit-wrap">
    <input class="inline-input" id="inp-bal-${accId}" type="number" step="0.01" value="${currentBal}">
    <button class="btn btn-xs btn-primary" onclick="saveBalance('${accId}','${elId}')">✓</button>
    <button class="btn btn-xs" onclick="cancelEditBalance('${elId}')">✕</button>
  </div>`;
  const inp=document.getElementById('inp-bal-'+accId);
  if(inp){inp.focus();inp.select();}
}
function cancelEditBalance(elId){
  const el=document.getElementById(elId);
  if(el&&_balOrig[elId]) el.innerHTML=_balOrig[elId];
}
async function saveBalance(accId,elId){
  const inp=document.getElementById('inp-bal-'+accId);
  if(!inp) return;
  const newBal=parseFloat(inp.value);
  if(isNaN(newBal)){toast('Monto inválido','err');return;}
  try{
    const r=await fetch(`${SB}/rest/v1/accounts?id=eq.${accId}`,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({balance:newBal})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const updated=await r.json();
    if(!Array.isArray(updated)||updated.length===0) throw new Error('Cuenta no encontrada');
    const el=document.getElementById(elId);
    if(el) el.innerHTML=fmtFull(newBal);
    toast('✓ Balance actualizado');
    setTimeout(load,800);
  }catch(e){toast('Error: '+e.message,'err');}
}
async function editBlackBalance(currentVal,accId){
  const nv=prompt('Total a pagar (override manual):',currentVal);
  if(nv===null) return;
  const parsed=parseFloat(nv);
  if(isNaN(parsed)){toast('Monto inválido','err');return;}
  try{
    const r=await fetch(`${SB}/rest/v1/accounts?id=eq.${accId}`,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({credit_card_balance:parsed})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast('✓ Actualizado a '+fmt(parsed));
    setTimeout(load,400);
  }catch(e){toast('Error: '+e.message,'err');}
}

// ── CARD TOGGLE ─────────────────────────────────────────────────────────────
function toggleCard(id){
  const body=document.getElementById('cb-'+id);
  const icon=document.getElementById('ci-'+id);
  if(!body||!icon) return;

function renderGFSection(gfs){
  const active=gfs.filter(g=>g.is_active);
  const freqM={mensual:1,bimestral:.5,trimestral:1/3,semestral:1/6,anual:1/12};
  const totalM=active.reduce((s,g)=>s+$f(g.amount)*(freqM[g.frequency]||1),0);
  const groups={};
  gfs.forEach(g=>{const c=g.category||'hogar';(groups[c]=groups[c]||[]).push(g);});
  const sorted=Object.entries(groups).sort((a,b)=>b[1].reduce((s,g)=>s+$f(g.amount),0)-a[1].reduce((s,g)=>s+$f(g.amount),0));
  let h='';
  sorted.forEach(([cat,items])=>{
    const cfg=GF_CATS[cat]||{l:cat,c:'#888'};
    const tot=items.filter(g=>g.is_active).reduce((s,g)=>s+$f(g.amount),0);
    h+=`<div class="gf-cat-section"><div class="gf-cat-header">
      <span class="gf-cat-name" style="color:${cfg.c}">${cfg.l}</span>

      <span class="gf-cat-total" style="color:${cfg.c}">$${tot.toFixed(2)}</span>
    </div><div class="gf-items">`;
    items.sort((a,b)=>$f(b.amount)-$f(a.amount)).forEach(g=>{
      const nm=g.name.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      const deferredBadge=g.is_deferred?`<span class="gf-deferred-badge">${g.deferred_current_installment}/${g.deferred_total_installments}</span>`:'';
      h+=`<div class="gf-item ${g.is_active?'':'inactive'}">
        <button class="gf-tog ${g.is_active?'on':'off'}" onclick="toggleGFActive('${g.id}',${g.is_active})"></button>
        <span class="gf-iname">${g.name} ${deferredBadge}</span>
        <span class="gf-ifreq">${g.frequency}</span>
        <span class="gf-iamt ${g.is_deferred?'c-warn':''}">$${$f(g.amount).toFixed(2)}</span>
        <div class="gf-acts">
          <button class="txn-btn edit" onclick='openEditGF(${JSON.stringify(g)})'>✏️</button>

        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  h+=`<div class="gf-summary"><span>Equiv. mensual: <strong>$${totalM.toFixed(2)}</strong></span><span>Activos: <strong>${active.length} / ${gfs.length}</strong></span></div>`;
  return h;
}

// ── PIE ──────────────────────────────────────────────────────────────────────
function buildPie(cats,total,size=160){
  if(!cats.length) return `<svg width="${size}" height="${size}"></svg>`;
  let angle=-Math.PI/2;
  const cx=size/2,cy=size/2,r=size/2-8,ri=r*0.55;
  let paths='';
  cats.forEach((c,i)=>{
    const slice=c[1]/total*Math.PI*2;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    const x2=cx+r*Math.cos(angle+slice),y2=cy+r*Math.sin(angle+slice);
    const xi1=cx+ri*Math.cos(angle),yi1=cy+ri*Math.sin(angle);
    const xi2=cx+ri*Math.cos(angle+slice),yi2=cy+ri*Math.sin(angle+slice);
    const large=slice>Math.PI?1:0;
    paths+=`<path d="M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${large},0 ${xi1},${yi1}" fill="${PIE_COLORS[i%PIE_COLORS.length]}" opacity="0.9"/>`;
    angle+=slice;
  });
  return `<svg class="pie-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${ri-2}" fill="var(--s1)"/></svg>`;
}

// ── CICLO BLACK/DINERS ───────────────────────────────────────────────────────
function getCycleRange(){
  // Ciclo: del 16 del mes anterior al 15 del mes actual
  const now=new Date();
  const day=now.getDate();
  let start,end;
  if(day>=16){
    start=new Date(now.getFullYear(),now.getMonth(),16);
    end=new Date(now.getFullYear(),now.getMonth()+1,15);
  } else {
    start=new Date(now.getFullYear(),now.getMonth()-1,16);
    end=new Date(now.getFullYear(),now.getMonth(),15);
  }
  return {
    start:start.toISOString().split('T')[0],
    end:end.toISOString().split('T')[0]
  };
}

    html+=`<div class="filter-bar">
      <select class="filter-select" id="filter-period" onchange="renderTxnList()">
        <option value="mes" style="background:#1A1F1B;color:var(--cream)">Este mes</option>
        <option value="hist" style="background:#1A1F1B;color:var(--cream)">Mes anterior + este mes</option>
      </select>
      <select class="filter-select" id="filter-acc" onchange="_filterAcc=this.value;renderTxnList()">
        <option value="" style="background:#1A1F1B;color:var(--cream)">Todas las cuentas</option>
        ${accOptions}
      </select>
      <select class="filter-select" id="filter-type" onchange="renderTxnList()">
        <option value="" style="background:#1A1F1B;color:var(--cream)">Todos los tipos</option>
        <option value="gasto" style="background:#1A1F1B;color:var(--cream)">Gastos</option>
        <option value="ingreso" style="background:#1A1F1B;color:var(--cream)">Ingresos</option>
        <option value="transferencia" style="background:#1A1F1B;color:var(--cream)">Transferencias</option>
        <option value="pago_tarjeta" style="background:#1A1F1B;color:var(--cream)">Pagos tarjeta</option>
        <option value="inversion" style="background:#1A1F1B;color:var(--cream)">Inversiones</option>
      </select>
    </div>`;
    html+=`<div class="g" style="padding:4px 0" id="txn-list"></div>`;
    html+=`<div class="show-more" id="txn-showmore"></div>`;
    html+=`</div></div>`;

    // GF
    html+=`<div class="sl-row" style="margin-top:28px"><span class="sl-label">gestión gastos fijos</span><button class="add-btn" onclick="openAddGF()">+ Agregar</button></div>`;
    html+=renderGFSection(GFS);

    // Sobres
    if(E.length>0){
      html+=`<p class="sl">sobres activos</p><div class="g" style="padding:16px 20px;margin-bottom:20px">`;
      E.forEach(e=>{
        const p2=pct($f(e.spent),$f(e.budgeted));
        html+=`<div class="sobre-row"><span class="sobre-name">${e.name}</span><div class="sobre-bar"><div class="sobre-fill" style="width:${p2}%;background:${p2>80?'var(--neg)':p2>50?'var(--warn)':'var(--pos)'}"></div></div><span class="sobre-amt">${fmt(e.spent)} / ${fmt(e.budgeted)}</span></div>`;
      });
      html+=`</div>`;
    }

    document.getElementById('main').innerHTML=html;
    document.getElementById('ts').textContent=`// ${now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})} · ${mesLabel}`;
    renderTxnList();
  }catch(err){
    document.getElementById('main').innerHTML=`<p style="color:var(--neg);font-family:'DM Mono',monospace;padding:24px">// error: ${err.message}</p>`;
    document.getElementById('ts').textContent='// error';
    console.error(err);
  }
}

function renderTxnList(){
  const el=document.getElementById('txn-list');
  if(!el) return;
  const periodFilter=document.getElementById('filter-period')?.value||'mes';
  const accFilter=document.getElementById('filter-acc')?.value||'';
  const typeFilter=document.getElementById('filter-type')?.value||'';
  let filtered=periodFilter==='hist'?_histTxns:_allTxns;
  if(accFilter) filtered=filtered.filter(t=>t.account_id===accFilter);
  if(typeFilter) filtered=filtered.filter(t=>t.type===typeFilter);
  const visible=_showAll?filtered:filtered.slice(0,15);
  el.innerHTML=visible.map(renderTxnRow).join('')||'<p style="text-align:center;color:var(--fg4);font-size:10px;padding:20px;font-family:\'DM Mono\',monospace">Sin transacciones</p>';
  const sm=document.getElementById('txn-showmore');
  if(sm) sm.innerHTML=filtered.length>15?`<button onclick="_showAll=!_showAll;renderTxnList()">${_showAll?'▲ Ver menos':'▼ Ver todas ('+filtered.length+')'}</button>`:'';
}

load();
setInterval(load,300000);
</script>
</body>
</html>
