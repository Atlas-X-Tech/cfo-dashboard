<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFO Personal · Carlos Amaya</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060A14;--s1:#0A1020;--s2:#0E1628;--s3:#131E35;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --fg:#EEF2FF;--fg2:rgba(238,242,255,0.6);--fg3:rgba(238,242,255,0.3);
  --blue:#7B9CFF;--blue-d:rgba(123,156,255,0.12);--blue-b:rgba(123,156,255,0.22);
  --teal:#4ECDC4;--teal-d:rgba(78,205,196,0.1);--teal-b:rgba(78,205,196,0.2);
  --red:#FF6B8A;--red-d:rgba(255,107,138,0.1);--red-b:rgba(255,107,138,0.2);
  --amber:#FFB347;--amber-d:rgba(255,179,71,0.1);--amber-b:rgba(255,179,71,0.2);
  --purple:#C084FC;--purple-d:rgba(192,132,252,0.1);
}
html{background:var(--bg);min-height:100vh}
body{font-family:'DM Sans',sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden}

/* BG */
.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-mesh::before{content:'';position:absolute;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(ellipse,rgba(123,156,255,0.07) 0%,transparent 65%);animation:float1 18s ease-in-out infinite}
.bg-mesh::after{content:'';position:absolute;bottom:-20%;right:-10%;width:60%;height:60%;background:radial-gradient(ellipse,rgba(78,205,196,0.05) 0%,transparent 65%);animation:float2 22s ease-in-out infinite 4s}
.bg-grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:200px}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3%,2%) scale(1.05)}66%{transform:translate(-2%,3%) scale(0.97)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3%,-2%) scale(1.08)}}

/* LAYOUT */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px 80px}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;padding:32px 0 28px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#fff;box-shadow:0 0 24px rgba(123,156,255,0.3)}
.brand-info h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.01em}
.brand-info p{font-size:11px;color:var(--fg3);font-family:'DM Mono',monospace;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
#ts{font-size:11px;color:var(--fg3);font-family:'DM Mono',monospace}
.btn{background:var(--blue-d);border:1px solid var(--blue-b);color:var(--blue);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.2s}
.btn:hover{background:rgba(123,156,255,0.2)}

/* SECTION LABEL */
.sl{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg3);margin:32px 0 12px;display:flex;align-items:center;gap:10px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}

/* GLASS */
.g{background:rgba(255,255,255,0.028);border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;transition:border-color 0.2s}
.g:hover{border-color:var(--border2)}
.g::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent)}
.at{position:absolute;top:0;left:0;right:0;height:2px;border-radius:14px 14px 0 0}
.at-blue{background:linear-gradient(90deg,var(--blue),transparent)}
.at-teal{background:linear-gradient(90deg,var(--teal),transparent)}
.at-red{background:linear-gradient(90deg,var(--red),transparent)}
.at-amber{background:linear-gradient(90deg,var(--amber),transparent)}
.at-purple{background:linear-gradient(90deg,var(--purple),transparent)}

/* GRIDS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:800px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}

/* KPI */
.kpi{padding:18px 20px}
.kpi-label{font-size:10px;color:var(--fg3);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px}
.kpi-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1}
.kpi-sub{font-size:11px;color:var(--fg3);margin-top:6px}
.kpi-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;margin-top:8px;letter-spacing:0.02em}
.bb-teal{background:var(--teal-d);color:var(--teal);border:1px solid var(--teal-b)}
.bb-red{background:var(--red-d);color:var(--red);border:1px solid var(--red-b)}
.bb-amber{background:var(--amber-d);color:var(--amber);border:1px solid var(--amber-b)}
.bb-blue{background:var(--blue-d);color:var(--blue);border:1px solid var(--blue-b)}

/* PROGRESS */
.pb{height:3px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:12px;overflow:hidden}
.pb-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* COLORES TEXTO */
.ct{color:var(--teal)}.cr{color:var(--red)}.cb{color:var(--blue)}.ca{color:var(--amber)}.cp{color:var(--purple)}

/* BLACK CARD */
.black-wrap{padding:22px 24px}
.black-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.black-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.02em}
.black-chip{font-size:9px;padding:3px 10px;border-radius:20px;background:var(--blue-d);color:var(--blue);border:1px solid var(--blue-b);font-family:'DM Mono',monospace;letter-spacing:0.12em;text-transform:uppercase}
.black-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.bi-l{font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;font-weight:500}
.bi-v{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.02em}
@media(max-width:600px){.black-grid{grid-template-columns:repeat(2,1fr)}}

/* CUENTAS */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.acc{padding:16px 18px}
.acc-bank{font-size:9px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:3px}
.acc-name{font-size:11px;color:var(--fg2);margin-bottom:10px}
.acc-bal{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.02em}
.acc-role{font-size:9px;color:var(--fg3);margin-top:5px;text-transform:uppercase;letter-spacing:0.08em}

/* TRANSFERS PROG */
.tf-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04)}
.tf-row:last-child{border-bottom:none}
.tf-left{display:flex;flex-direction:column;gap:3px}
.tf-name{font-size:13px;font-weight:400}
.tf-meta{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace}
.tf-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px}
.ts-done{background:var(--teal-d);color:var(--teal);border:1px solid var(--teal-b)}
.ts-pend{background:var(--amber-d);color:var(--amber);border:1px solid var(--amber-b)}
.tf-amt{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--fg2);margin-left:12px;flex-shrink:0}

/* CAT */
.cat-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.035)}
.cat-row:last-child{border-bottom:none}
.cat-name{font-size:12px;color:var(--fg2);width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar{flex:1;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.cat-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--teal));opacity:0.7}
.cat-amt{font-size:11px;font-family:'DM Mono',monospace;color:var(--fg2);width:65px;text-align:right;flex-shrink:0}

/* TXN */
.txn{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;transition:background 0.15s;border-bottom:1px solid rgba(255,255,255,0.035)}
.txn:last-child{border-bottom:none}
.txn:hover{background:rgba(255,255,255,0.025)}
.txn-l{display:flex;flex-direction:column;gap:3px}
.txn-desc{font-size:12px;color:var(--fg)}
.txn-meta{font-size:10px;color:var(--fg3);font-family:'DM Mono',monospace}
.txn-amt{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:-0.01em;flex-shrink:0}
.src{font-size:9px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,0.04);color:var(--fg3);border:1px solid var(--border);margin-left:5px;font-family:'DM Mono',monospace;vertical-align:middle}

/* SOBRES */
.sobre-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.sobre-row:last-child{border-bottom:none}
.sobre-name{font-size:12px;color:var(--fg2);width:160px;flex-shrink:0}
.sobre-bar{flex:1;height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.sobre-fill{height:100%;border-radius:2px}
.sobre-amt{font-size:10px;color:var(--fg3);width:100px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}

/* CHK */
.chk-sum{display:flex;gap:18px;font-size:12px;color:var(--fg3);margin-bottom:14px;flex-wrap:wrap}
.chk-sum strong{color:var(--fg2)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chk-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.015);transition:all 0.2s}
.chk-item.paid{border-color:rgba(78,205,196,0.15);background:rgba(78,205,196,0.025)}
.chk-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.dot-ok{background:rgba(78,205,196,0.15);color:var(--teal);border:1px solid rgba(78,205,196,0.3)}
.dot-pend{background:rgba(255,255,255,0.03);color:var(--fg3);border:1px solid var(--border2)}
.chk-name{flex:1;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk-item.paid .chk-name{color:var(--fg3);text-decoration:line-through;text-decoration-color:rgba(78,205,196,0.35)}
.chk-item.paid .chk-val{color:var(--teal)}
.chk-val{font-size:11px;flex-shrink:0;font-family:'DM Mono',monospace;color:var(--fg3)}

.loading{color:var(--fg3);font-size:12px;padding:80px 0;text-align:center;font-family:'DM Mono',monospace;letter-spacing:0.05em}
.err{color:var(--red);font-size:12px;padding:24px 0;font-family:'DM Mono',monospace}
.empty{color:var(--fg3);font-size:12px;padding:20px 0;text-align:center;font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="bg-grain"></div>
<div class="wrap">
<header>
  <div class="brand">
    <div class="brand-logo">C</div>
    <div class="brand-info">
      <h1>CFO Personal</h1>
      <p id="ts">// conectando...</p>
    </div>
  </div>
  <div class="header-right">
    <button class="btn" onclick="load()">↺ Actualizar</button>
  </div>
</header>
<main id="main"><p class="loading">// cargando datos financieros...</p></main>
</div>

<script>
const SB='https://apdgxypnkrphulpcplpv.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwZGd4eXBua3JwaHVscGNwbHB2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3Nzc0MjA5NiwiZXhwIjoyMDkzMzE4MDk2fQ.KVECO5w6Y0-lqFw9Uo_VCJLy_lqRfMyZ-uLus_vFxto';
const H={apikey:SK,Authorization:'Bearer '+SK};
const q=p=>fetch(SB+'/rest/v1/'+p,{headers:H}).then(r=>r.json());
const $f=n=>parseFloat(n||0);
const fmt=n=>'$'+$f(n).toFixed(2);
const fmtK=n=>{const v=$f(n);return v>=1000?'$'+(v/1000).toFixed(1)+'k':fmt(v)};
const pct=(a,b)=>b>0?Math.min(100,a/b*100):0;
const barC=(p,inv=false)=>inv?(p<=25?'var(--teal)':p<=50?'var(--amber)':'var(--red)'):(p>=66?'var(--teal)':p>=33?'var(--amber)':'var(--red)');

async function load(){
  document.getElementById('ts').textContent='// actualizando...';
  const main=document.getElementById('main');
  try{
    const now=new Date();
    const mes=new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
    const mesLabel=now.toLocaleDateString('es-EC',{month:'long',year:'numeric'});
    const day=now.getDate();

    const [accs,txns,ccs,envs,chk]=await Promise.all([
      q('accounts?select=id,name,bank,role,balance&order=bank'),
      q('transactions?transaction_date=gte.'+mes+'&order=transaction_date.desc&select=*,categories(name),accounts!transactions_account_id_fkey(bank,name)'),
      q('v_credit_card_cycle?select=*'),
      q('envelopes?month=eq.'+mes+'&status=eq.active&select=*'),
      q('monthly_expense_status?month=eq.'+mes+'&select=*,fixed_expenses(name,amount,category)&order=status.asc,fixed_expenses(name).asc')
    ]);

    const T=Array.isArray(txns)?txns:[];
    const A=Array.isArray(accs)?accs:[];
    const CC=Array.isArray(ccs)?ccs:[];
    const E=Array.isArray(envs)?envs:[];
    const CHK=Array.isArray(chk)?chk:[];

    // Agrupar cuentas por rol
    const byRole=r=>A.filter(a=>a.role===r);
    const recep=byRole('recepcion_black')[0]||{balance:0,name:'Produbanco Corriente'};
    const opProd=byRole('operativa')[0]||{balance:0,name:'Produbanco Ahorro'};
    const flexi=byRole('ahorro_diferido')[0]||{balance:0,name:'Produbanco Flexiahorro'};
    const opPich=byRole('operativa_deuna')[0]||{balance:0,name:'Pichincha Corriente'};
    const ahorPich=byRole('ahorro_proposito')[0]||{balance:0,name:'Pichincha Ahorro'};
    const inv=byRole('inversion')[0]||{balance:0,name:'Guayaquil Corriente'};
    const metas=byRole('metas')[0]||{balance:0,name:'Guayaquil Ahorro'};

    // Métricas
    const gastos=T.filter(t=>['gasto','pago_tarjeta','transferencia','ahorro_diferido'].includes(t.type));
    const ingresos=T.filter(t=>['ingreso','ingreso_variable'].includes(t.type));
    const tG=$f(gastos.reduce((s,t)=>s+$f(t.amount),0));
    const tI=$f(ingresos.reduce((s,t)=>s+$f(t.amount),0));
    const balance=tI-tG;
    const tasaAhorro=tI>0?((tI-tG)/tI*100):0;
    const presupuesto=1049;
    const pctG=pct(tG,presupuesto);

    // Black
    const black=CC[0]||{};
    const bDeuda=$f(black.previous_cycle_debt);
    const bCiclo=$f(black.current_cycle_spent);
    const bTotal=$f(black.total_to_provision);
    const bDias=black.days_until_cutoff!=null?parseInt(black.days_until_cutoff):(20-day);
    const bCut=black.next_cut_date?new Date(black.next_cut_date).toLocaleDateString('es-EC',{day:'numeric',month:'short'}):('15 de cada mes');
    const bPago=black.payment_due_date?new Date(black.payment_due_date).toLocaleDateString('es-EC',{day:'numeric',month:'short'}):('1 de cada mes');

    // Checklist
    const pagados=CHK.filter(c=>c.status==='pagado');
    const pendientes=CHK.filter(c=>c.status==='pendiente');
    const tPagado=pagados.reduce((s,c)=>s+$f(c.fixed_expenses?.amount),0);
    const tFijos=CHK.reduce((s,c)=>s+$f(c.fixed_expenses?.amount),0);
    const chkPct=pct(pagados.length,CHK.length);

    // Transferencias programadas
    const transfers=[
      {name:'Transfer a Pichincha',meta:'Gym · Novia · Creatina · Contadora · Oficina · Bus',amt:85.36,done:false,banco:'pichincha'},
      {name:'Día de la Madre',meta:'Sobre creado',amt:50.00,done:false,banco:''},
      {name:'Viaje Playa Dani',meta:'Sobre creado · en imprevistos',amt:80.00,done:false,banco:''},
    ];

    // Categorías
    const catMap={};
    gastos.forEach(t=>{const c=t.categories?.name||'Sin categoría';catMap[c]=(catMap[c]||0)+$f(t.amount)});
    const topCats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,7);
    const maxC=topCats[0]?topCats[0][1]:1;

    // FE
    const feSaldo=$f(opProd.balance);
    const feMeta=presupuesto*6;
    const fePct=pct(feSaldo,feMeta);

    let html='';

    // ── RESUMEN MES ──
    html+=`<p class="sl">resumen · ${mesLabel}</p>`;
    html+=`<div class="g4" style="margin-bottom:20px">`;

    html+=`<div class="g kpi"><div class="at at-teal"></div>
      <p class="kpi-label">Ingresos</p>
      <p class="kpi-val ct">${fmtK(tI)}</p>
      <p class="kpi-sub">este mes</p></div>`;

    html+=`<div class="g kpi"><div class="at at-red"></div>
      <p class="kpi-label">Gastos</p>
      <p class="kpi-val cr">${fmtK(tG)}</p>
      <p class="kpi-sub">${pctG.toFixed(0)}% del presupuesto</p>
      <div class="pb"><div class="pb-fill" style="width:${Math.min(100,pctG)}%;background:${barC(100-pctG)}"></div></div></div>`;

    html+=`<div class="g kpi">
      <p class="kpi-label">Balance neto</p>
      <p class="kpi-val ${balance>=0?'ct':'cr'}">${fmtK(balance)}</p>
      <span class="kpi-badge ${balance>=0?'bb-teal':'bb-red'}">${balance>=0?'↑ positivo':'↓ negativo'}</span></div>`;

    html+=`<div class="g kpi">
      <p class="kpi-label">Tasa de ahorro</p>
      <p class="kpi-val ${tasaAhorro>=10?'ct':tasaAhorro>=5?'ca':'cr'}">${tasaAhorro.toFixed(1)}%</p>
      <span class="kpi-badge ${tasaAhorro>=10?'bb-teal':tasaAhorro>=5?'bb-amber':'bb-red'}">${tasaAhorro>=10?'saludable':tasaAhorro>=5?'revisar':'atención'}</span></div>`;
    html+=`</div>`;

    // ── TARJETA BLACK ──
    html+=`<p class="sl">tarjeta black · Produbanco</p>`;
    html+=`<div class="g" style="margin-bottom:20px"><div class="at at-blue"></div><div class="black-wrap">
      <div class="black-top"><span class="black-name">Black Mastercard</span><span class="black-chip">${Math.max(0,bDias)}d para corte · ${bCut}</span></div>
      <div class="black-grid">
        <div><p class="bi-l">Deuda anterior</p><p class="bi-v ca">${fmtK(bDeuda)}</p></div>
        <div><p class="bi-l">Ciclo actual</p><p class="bi-v cb">${fmtK(bCiclo)}</p></div>
        <div><p class="bi-l">Total a pagar</p><p class="bi-v ${bTotal>500?'cr':bTotal>300?'ca':'ct'}">${fmtK(bTotal)}</p></div>
        <div><p class="bi-l">Fecha pago</p><p class="bi-v" style="font-size:16px">${bPago}</p></div>
      </div>
      <div class="pb" style="margin-top:16px"><div class="pb-fill" style="width:${Math.min(100,pct(bDeuda,1049))}%;background:${bDeuda>400?'var(--red)':bDeuda>250?'var(--amber)':'var(--blue)'}"></div></div>
      <p style="font-size:10px;color:var(--fg3);margin-top:5px;font-family:'DM Mono',monospace">deuda vs ingreso mensual $${presupuesto}</p>
    </div></div>`;

    // ── KPIs SECUNDARIOS ──
    html+=`<p class="sl">kpis financieros</p>`;
    html+=`<div class="g3" style="margin-bottom:20px">`;
    html+=`<div class="g kpi"><p class="kpi-label">Fondo emergencia</p>
      <p class="kpi-val ${fePct>=50?'ct':fePct>=25?'ca':'cr'}">${fePct.toFixed(1)}%</p>
      <p class="kpi-sub">${fmt(feSaldo)} de ${fmt(feMeta)}</p>
      <div class="pb"><div class="pb-fill" style="width:${fePct}%;background:${fePct>=50?'var(--teal)':fePct>=25?'var(--amber)':'var(--red)'}"></div></div></div>`;
    html+=`<div class="g kpi"><p class="kpi-label">Gastos fijos</p>
      <p class="kpi-val ${chkPct>=80?'ct':chkPct>=50?'ca':'cr'}">${pagados.length}<span style="font-size:16px;font-weight:400;color:var(--fg3)"> / ${CHK.length}</span></p>
      <p class="kpi-sub">${fmt(tPagado)} de ${fmt(tFijos)}</p>
      <div class="pb"><div class="pb-fill" style="width:${chkPct}%;background:${chkPct>=80?'var(--teal)':chkPct>=50?'var(--amber)':'var(--red)'}"></div></div></div>`;
    html+=`<div class="g kpi"><p class="kpi-label">Transacciones</p>
      <p class="kpi-val cb">${T.length}</p>
      <p class="kpi-sub">Auto: ${T.filter(t=>t.source==='gmail').length} · Manual: ${T.filter(t=>t.source==='telegram').length}</p></div>`;
    html+=`</div>`;

    // ── CUENTAS ──
    html+=`<p class="sl">cuentas · Produbanco</p>`;
    html+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px">`;
    const prodCuentas=[
      {a:recep,col:'cr',label:'recepción · black',at:'at-red'},
      {a:opProd,col:'ct',label:'operativa principal',at:'at-teal'},
      {a:flexi,col:'ca',label:'diferidos acumulados',at:'at-amber'},
    ];
    prodCuentas.forEach(({a,col,label,at})=>{
      html+=`<div class="g acc"><div class="at ${at}"></div>
        <p class="acc-bank" style="color:var(--blue)">Produbanco</p>
        <p class="acc-name">${a.name||'-'}</p>
        <p class="acc-bal ${col}">${fmt(a.balance)}</p>
        <p class="acc-role">${label}</p></div>`;
    });
    html+=`</div>`;

    html+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px">`;
    const pichCuentas=[
      {a:opPich,col:'ct',label:'operativa DeUna',at:'at-teal'},
      {a:ahorPich,col:'cb',label:'ahorro con propósito',at:'at-blue'},
    ];
    pichCuentas.forEach(({a,col,label,at})=>{
      html+=`<div class="g acc"><div class="at ${at}"></div>
        <p class="acc-bank" style="color:var(--teal)">Pichincha</p>
        <p class="acc-name">${a.name||'-'}</p>
        <p class="acc-bal ${col}">${fmt(a.balance)}</p>
        <p class="acc-role">${label}</p></div>`;
    });
    html+=`</div>`;

    html+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px">`;
    const guayCuentas=[
      {a:inv,col:'ca',label:'inversión mensual',at:'at-amber'},
      {a:metas,col:'cp',label:'metas',at:'at-purple'},
    ];
    guayCuentas.forEach(({a,col,label,at})=>{
      html+=`<div class="g acc"><div class="at ${at}"></div>
        <p class="acc-bank" style="color:var(--amber)">Guayaquil</p>
        <p class="acc-name">${a.name||'-'}</p>
        <p class="acc-bal ${col}">${fmt(a.balance)}</p>
        <p class="acc-role">${label}</p></div>`;
    });
    html+=`</div>`;

    // ── TRANSFERENCIAS PROGRAMADAS ──
    html+=`<p class="sl">transferencias programadas · Mayo</p>`;
    html+=`<div class="g" style="margin-bottom:20px;padding:4px 0">`;
    transfers.forEach(tf=>{
      html+=`<div class="tf-row">
        <div class="tf-left">
          <span class="tf-name">${tf.name}</span>
          <span class="tf-meta">${tf.meta}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="tf-status ${tf.done?'ts-done':'ts-pend'}">${tf.done?'✓ listo':'pendiente'}</span>
          <span class="tf-amt">${fmt(tf.amt)}</span>
        </div>
      </div>`;
    });
    html+=`</div>`;

    // ── DOS COLUMNAS: CATS + TXN ──
    html+=`<div class="g2" style="margin-bottom:20px;align-items:start">`;

    // Categorías
    html+=`<div>`;
    if(topCats.length>0){
      html+=`<p class="sl">gastos por categoría</p>`;
      html+=`<div class="g" style="padding:16px 20px">`;
      topCats.forEach(([cat,amt])=>{
        html+=`<div class="cat-row"><span class="cat-name">${cat}</span>
          <div class="cat-bar"><div class="cat-fill" style="width:${pct(amt,maxC)}%"></div></div>
          <span class="cat-amt">${fmt(amt)}</span></div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;

    // Transacciones
    html+=`<div>`;
    const recTxn=T.slice(0,8);
    if(recTxn.length>0){
      html+=`<p class="sl">últimas transacciones</p>`;
      html+=`<div class="g" style="padding:4px 0">`;
      recTxn.forEach(t=>{
        const isG=['gasto','pago_tarjeta','transferencia','ahorro_diferido'].includes(t.type);
        const cat=t.categories?.name||t.type;
        const banco=t.accounts?.bank||'';
        html+=`<div class="txn">
          <div class="txn-l">
            <span class="txn-desc">${t.description||cat}<span class="src">${t.source||'manual'}</span></span>
            <span class="txn-meta">${cat}${banco?' · '+banco:''} · ${t.transaction_date}</span>
          </div>
          <span class="txn-amt ${isG?'cr':'ct'}">${isG?'−':'+'}${fmt(t.amount)}</span>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
    html+=`</div>`;

    // ── SOBRES ──
    if(E.length>0){
      html+=`<p class="sl">sobres activos</p>`;
      html+=`<div class="g" style="padding:16px 20px;margin-bottom:20px">`;
      E.forEach(e=>{
        const p2=pct($f(e.spent),$f(e.budgeted));
        html+=`<div class="sobre-row">
          <span class="sobre-name">${e.name}</span>
          <div class="sobre-bar"><div class="sobre-fill" style="width:${p2}%;background:${p2>80?'var(--red)':p2>50?'var(--amber)':'var(--teal)'}"></div></div>
          <span class="sobre-amt">${fmt(e.spent)} / ${fmt(e.budgeted)}</span>
        </div>`;
      });
      html+=`</div>`;
    }

    // ── CHECKLIST ──
    if(CHK.length>0){
      html+=`<p class="sl">checklist gastos fijos</p>`;
      html+=`<div class="chk-sum">
        <span>Pagados: <strong>${pagados.length}</strong></span>
        <span>Pendientes: <strong>${pendientes.length}</strong></span>
        <span>Pagado: <strong>${fmt(tPagado)}</strong></span>
        <span style="color:var(--amber)">Pendiente: <strong>${fmt(tFijos-tPagado)}</strong></span>
      </div>`;
      html+=`<div class="chk-grid">`;
      CHK.forEach(c=>{
        const fe=c.fixed_expenses||{};
        const done=c.status==='pagado';
        html+=`<div class="chk-item ${done?'paid':''}">
          <div class="chk-dot ${done?'dot-ok':'dot-pend'}">${done?'✓':'○'}</div>
          <span class="chk-name">${fe.name||'Gasto'}</span>
          <span class="chk-val">${fmt(fe.amount||0)}</span>
        </div>`;
      });
      html+=`</div>`;
    }

    html+=`<div style="height:48px"></div>`;
    main.innerHTML=html;
    document.getElementById('ts').textContent=`// ${now.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})} · ${mesLabel}`;

  }catch(err){
    main.innerHTML=`<p class="err">// error: ${err.message}</p>`;
    document.getElementById('ts').textContent='// error';
    console.error(err);
  }
}
load();
setInterval(load,300000);
</script>
</body>
</html>
